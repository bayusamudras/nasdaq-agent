name: Nasdaq Agent

# Jalan otomatis (jadwal dalam UTC). Batas terkecil GitHub Actions adalah 5 menit dan tidak dijamin
# tepat waktu. Menit digeser dari 00/30 karena jam sibuk sering menunda atau melewatkan run.
# Senin-Jumat: tiap 5 menit. Sabtu-Minggu: tiap 15 menit.
on:
  schedule:
    - cron: "2-59/5 * * * 1-5"
    - cron: "11-59/15 * * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nasdaq-agent
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang paket Claude (hanya jika kunci ada)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install anthropic
      - name: Jalankan agen
        run: python agent.py --out docs
      - name: Simpan laporan
        run: |
          git config user.name "nasdaq-agent"
          git config user.email "nasdaq-agent@users.noreply.github.com"
          git add docs/report.json docs/report.md docs/history.json
          git diff --cached --quiet || git commit -m "Update laporan Nasdaq"
          git pull --rebase
          git push
