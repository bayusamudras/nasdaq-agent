name: Nasdaq Agent

# Cron GitHub sering tertunda berjam-jam, jadi satu run dibuat hidup ~27 menit dan memperbarui laporan
# tiap 60 detik (tiap 5 menit di akhir pekan). Di akhir, run memicu dirinya sendiri agar berlanjut tanpa jeda.
# Cron tetap ada sebagai pengaman bila rantai terputus.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: nasdaq-agent
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang paket Claude (hanya jika kunci ada)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install anthropic
      - name: Perbarui laporan berulang
        run: |
          git config user.name "nasdaq-agent"
          git config user.email "nasdaq-agent@users.noreply.github.com"
          END=$((SECONDS + 1620))
          NEXT=0
          # Sambungkan run berikutnya dengan retry (GitHub kadang membalas HTTP 500/502).
          chain() {
            for i in 1 2 3 4 5 6 7 8; do
              gh workflow run nasdaq-agent.yml --ref "${GITHUB_REF_NAME}" && return 0
              sleep $((i * 5))
            done
            return 1
          }
          while [ "$SECONDS" -lt "$END" ]; do
            START=$SECONDS
            python agent.py --out docs || echo "agen gagal pada putaran ini"
            for f in docs/report.json docs/report.md docs/history.json docs/history.csv docs/cot.json docs/breadth.json docs/backtest.json; do if [ -f "$f" ]; then git add "$f"; fi; done
            if ! git diff --cached --quiet; then
              git commit -q -m "Update laporan Nasdaq"
              for i in 1 2 3; do
                git pull -q --rebase && git push -q && break
                sleep 3
              done
            fi
            # Dispatch dini (3 menit sebelum selesai): run baru menunggu di antrean concurrency, jadi tidak ada jeda.
            if [ "$NEXT" -eq 0 ] && [ "$SECONDS" -ge $((END - 180)) ]; then
              chain && NEXT=1 && echo "run berikutnya sudah diantrekan"
            fi
            if [ "$(date -u +%u)" -ge 6 ]; then STEP=300; else STEP=60; fi
            USED=$((SECONDS - START))
            [ "$USED" -lt "$STEP" ] && sleep $((STEP - USED))
          done
      - name: Sambung ke run berikutnya (pengaman)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hanya antre bila belum ada run lain yang menunggu; gagal setelah retry harus terlihat (bukan ditelan).
          Q=$(gh run list --workflow nasdaq-agent.yml --status queued --json databaseId -q 'length' || echo 0)
          if [ "${Q:-0}" -gt 0 ]; then echo "sudah ada run menunggu"; exit 0; fi
          for i in 1 2 3 4 5 6 7 8; do
            gh workflow run nasdaq-agent.yml --ref "${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
