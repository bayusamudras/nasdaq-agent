name: Nasdaq Agent

# Jalan otomatis sepanjang hari agar semua berita berdampak terbaca (jadwal dalam UTC):
# tiap 30 menit Senin-Jumat, tiap jam pada Sabtu-Minggu.
on:
  schedule:
    - cron: "*/30 * * * 1-5"
    - cron: "0 * * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nasdaq-agent
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Jalankan agen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py --out docs
      - name: Simpan laporan
        run: |
          git config user.name "nasdaq-agent"
          git config user.email "nasdaq-agent@users.noreply.github.com"
          git add docs/report.json docs/report.md
          git diff --cached --quiet || git commit -m "Update laporan Nasdaq"
          git pull --rebase
          git push
