name: tes
on:
  push:
    paths: ["agent.py", "backtest.py", "tests/**", ".github/workflows/ci.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile agent.py backtest.py
      - run: python -m unittest discover -s tests -v
