<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berita Terbaru Nasdaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #00101f; --card: #001f3f; --surface: #00182f; --card-2: #052b52;
  --ink: #ffffff; --muted: #9db8cc; --line: #17405f;
  --blue: #00d1b2; --bull: #19e0bf; --bear: #ff8a8a; --flat: #f1c678;
  --bull-soft: rgba(25,224,191,.12); --bear-soft: rgba(255,142,158,.12); --flat-soft: rgba(241,198,120,.13);
  --f: "Plus Jakarta Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14.5px; line-height: 1.5;
  background-image: radial-gradient(900px 420px at 80% -80px, rgba(0,209,178,.14), transparent), radial-gradient(700px 360px at -10% 0, rgba(25,224,191,.08), transparent); }
.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.top h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.01em; }
.back { color: var(--blue); text-decoration: none; font-weight: 600; font-size: 13.5px; }
.back:hover { text-decoration: underline; }
.clock { font-family: var(--mono); font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--ink); }
.clock.stale { color: var(--flat); } .clock.dead { color: var(--bear); }
#banner:empty { display: none; }
.bn { border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: space-between; align-items: center; }
.bn.err { background: var(--bear-soft); color: var(--bear); } .bn.warn { background: var(--flat-soft); color: var(--flat); }
.bn button { font: inherit; font-size: 12.5px; font-weight: 700; padding: 5px 14px; border: 0; border-radius: 999px; background: var(--blue); color: #00101f; cursor: pointer; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; position: sticky; top: 0; z-index: 3; padding: 10px 0; background: linear-gradient(var(--bg) 80%, transparent); }
.tools input { flex: 1 1 220px; min-width: 0; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; }
.tools input::placeholder { color: var(--muted); }
.tools input:focus-visible, .chips button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--blue); color: #00101f; border-color: var(--blue); font-weight: 700; }
.count { color: var(--muted); font-size: 12.5px; margin: 2px 2px 10px; }
.day { margin: 22px 0 8px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.n { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 4px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px 16px; margin-bottom: 8px; }
.n.new { border-color: rgba(0,209,178,.6); box-shadow: 0 0 0 3px rgba(0,209,178,.12); }
.tm { font-family: var(--mono); font-size: 13px; font-weight: 500; line-height: 1.3; }
.tm small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.n h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.n h2 a { color: inherit; text-decoration: none; } .n h2 a:hover { text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.tag.up { background: var(--bull-soft); color: var(--bull); } .tag.dn { background: var(--bear-soft); color: var(--bear); }
.tag.fed { background: rgba(0,209,178,.16); color: var(--blue); } .tag.nw { background: var(--blue); color: #00101f; }
.why { margin: 8px 0 0; font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.why b { color: var(--ink); font-weight: 600; }
.why.up { border-color: var(--bull); } .why.dn { border-color: var(--bear); }
.empty { text-align: center; color: var(--muted); padding: 40px 8px; }
@media (max-width: 560px) { .n { grid-template-columns: minmax(0, 1fr); } .tm small { display: inline; margin-left: 8px; } .tm { display: flex; align-items: baseline; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <a class="back" href="./">← Kembali ke dashboard</a>
      <h1>Berita terbaru</h1>
    </div>
    <div class="clock" id="clock">memuat…</div>
  </div>
  <div id="banner" role="status" aria-live="polite"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Cari judul, sumber, atau tema…" aria-label="Cari berita">
    <div class="chips" id="chips" role="group" aria-label="Filter">
      <button type="button" data-f="all" aria-pressed="true">Semua</button>
      <button type="button" data-f="bullish" aria-pressed="false">Bullish</button>
      <button type="button" data-f="bearish" aria-pressed="false">Bearish</button>
      <button type="button" data-f="netral" aria-pressed="false">Netral</button>
      <button type="button" data-f="fed" aria-pressed="false">Fed</button>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script>
(function () {
  var R = null, FILTER = "all", Q = "", LOADERR = null, seen = null, lastGen = null;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//.test(u || "") ? u : ""; }
  var TZ = "Asia/Jakarta";
  function hm(d) { return d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ }).replace(".", ":"); }
  function hms(d) { return d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: TZ }).replace(/\./g, ":"); }
  function dayKey(d) { return d.toLocaleDateString("en-CA", { timeZone: TZ }); }
  function ago(sec) { return sec < 90 ? Math.max(0, Math.round(sec)) + " dtk" : sec < 5400 ? Math.round(sec / 60) + " mnt" : sec < 172800 ? Math.round(sec / 3600) + " jam" : Math.round(sec / 86400) + " hr"; }
  function dayLabel(k) {
    var today = dayKey(new Date()), yest = dayKey(new Date(Date.now() - 86400000));
    if (k === today) return "Hari ini";
    if (k === yest) return "Kemarin";
    return new Date(k + "T12:00:00Z").toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
  }

  async function load() {
    var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 10000);
    try {
      var resp = await fetch("report.json?t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
      clearTimeout(to);
      if (!resp.ok) { LOADERR = "Server membalas " + resp.status; return null; }
      var j = await resp.json(); LOADERR = null; return j;
    } catch (e) { clearTimeout(to); LOADERR = e && e.name === "AbortError" ? "Permintaan melewati batas waktu 10 detik" : "Tidak bisa mengambil laporan"; return null; }
  }

  function feed() {
    if (!R) return [];
    if (R.news_feed && R.news_feed.length) return R.news_feed;
    // laporan versi lama: pakai daftar berita yang ada, urutkan menurut waktu
    return (R.items || []).map(function (i) {
      return { title: i.title, source: i.source, link: i.link, published: i.published, score: i.score,
        direction: i.score > 0 ? "bullish" : i.score < 0 ? "bearish" : "netral", sources: i.source ? [i.source] : [],
        theme: i.theme, label: i.impacts && i.impacts[0] && i.impacts[0].label, why: i.impacts && i.impacts[0] && i.impacts[0].why, fed: false };
    }).sort(function (a, b) { return (b.published || "") < (a.published || "") ? -1 : 1; });
  }

  function render() {
    var all = feed(), ql = Q.trim().toLowerCase();
    var list = all.filter(function (n) {
      if (FILTER === "fed" && !n.fed) return false;
      if ((FILTER === "bullish" || FILTER === "bearish" || FILTER === "netral") && n.direction !== FILTER) return false;
      if (ql && (n.title + " " + (n.sources || []).join(" ") + " " + (n.theme || "")).toLowerCase().indexOf(ql) < 0) return false;
      return true;
    });
    $("count").textContent = list.length + " dari " + all.length + " berita, terbaru di atas";
    if (!list.length) { $("list").innerHTML = '<div class="empty">' + (all.length ? "Tidak ada berita yang cocok dengan filter." : (LOADERR ? "Berita belum bisa dimuat." : "Belum ada berita. Menunggu laporan agen.")) + "</div>"; return; }
    var html = "", cur = null, now = Date.now();
    list.forEach(function (n) {
      var d = n.published ? new Date(n.published) : null, valid = d && !isNaN(d);
      var k = valid ? dayKey(d) : "tanpa-waktu";
      if (k !== cur) { cur = k; html += '<div class="day">' + (valid ? esc(dayLabel(k)) : "Waktu tidak diketahui") + "</div>"; }
      var isNew = seen && !seen[n.title];
      var u = safeUrl(n.link), t = u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(n.title) + "</a>" : esc(n.title);
      var dirTag = n.direction === "bullish" ? '<span class="tag up">Bullish ' + (n.score > 0 ? "+" : "") + String(n.score).replace(".", ",") + "</span>" :
                   n.direction === "bearish" ? '<span class="tag dn">Bearish ' + String(n.score).replace(".", ",").replace("-", "−") + "</span>" : '<span class="tag">Netral</span>';
      var src = (n.sources && n.sources.length ? n.sources.slice(0, 3).join(", ") + (n.sources.length > 3 ? " +" + (n.sources.length - 3) : "") : (n.source || ""));
      html += '<article class="n' + (isNew ? " new" : "") + '"><div class="tm">' + (valid ? hm(d) + "<small>" + ago((now - d.getTime()) / 1000) + " lalu</small>" : "–") +
        "</div><div><h2>" + t + '</h2><div class="meta">' + dirTag + (n.fed ? '<span class="tag fed">Fed</span>' : "") + (isNew ? '<span class="tag nw">baru</span>' : "") +
        (n.theme ? "<span>" + esc(n.theme) + "</span>" : "") + (src ? "<span>· " + esc(src) + "</span>" : "") + "</div>" +
        (n.why ? '<p class="why ' + (n.direction === "bullish" ? "up" : n.direction === "bearish" ? "dn" : "") + '"><b>' + esc(n.label || "Dampak") + ":</b> " + esc(n.why) + "</p>" : "") + "</div></article>";
    });
    $("list").innerHTML = html;
  }

  function fresh() {
    var c = $("clock"), b = $("banner"), html = "";
    if (!R) { c.textContent = LOADERR ? "gagal memuat" : "memuat…"; c.className = "clock" + (LOADERR ? " dead" : ""); }
    else {
      var g = new Date(R.fetched_at || R.generated_at), age = (Date.now() - g.getTime()) / 1000;
      c.textContent = "agen menarik data " + (isNaN(g) ? "" : hms(g) + " WIB · " + ago(age) + " lalu");
      c.className = "clock" + (age > 2700 ? " dead" : age > 900 ? " stale" : "");
      if (!LOADERR && age > 2700) html = '<div class="bn err"><span>⚠ Data sudah ' + ago(age) + ". Agen mungkin berhenti; berita di bawah bisa basi.</span></div>";
      else if (!LOADERR && age > 900) html = '<div class="bn warn"><span>Data berumur ' + ago(age) + ". Jadwal GitHub kadang tertunda.</span></div>";
    }
    if (LOADERR) html = '<div class="bn err"><span>⚠ ' + esc(LOADERR) + "." + (R ? " Menampilkan berita terakhir yang berhasil dimuat." : "") + '</span><button type="button" id="retry">Coba lagi</button></div>';
    if (b.getAttribute("data-h") !== html) {
      b.innerHTML = html; b.setAttribute("data-h", html);
      var rb = $("retry"); if (rb) rb.addEventListener("click", tick);
    }
  }

  async function tick() {
    var r = await load();
    if (r && r.generated_at !== lastGen) {
      var prev = {}; feed().forEach(function (n) { prev[n.title] = 1; });
      var hadPrev = !!R;
      R = r; lastGen = r.generated_at;
      seen = hadPrev ? prev : null;
      render();
    } else if (!R) render();
    fresh();
  }

  $("q").addEventListener("input", function () { Q = this.value; render(); });
  document.querySelectorAll("#chips button").forEach(function (b) {
    b.addEventListener("click", function () {
      FILTER = b.getAttribute("data-f");
      document.querySelectorAll("#chips button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      render();
    });
  });
  setInterval(fresh, 1000);
  setInterval(tick, 30000);
  tick();
})();
</script>
</body>
</html>
